name: sync-notion

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  actions: write

concurrency:
  group: notion-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch district data (WFS + OSM)
        run: python fetch_districts.py

      - name: Sync sub-districts to Notion
        run: python sync_notion_districts.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Commit regenerated data
        run: |
          git config user.name "map-sync bot"
          git config user.email "actions@users.noreply.github.com"
          git add munich_bezirksteile_named.geojson munich_districts_detail.md
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "update district data from WFS/OSM"
            git push origin main
          fi

      - name: Rebuild and deploy map
        run: gh workflow run sync-map.yml
        env:
          GH_TOKEN: ${{ github.token }}
